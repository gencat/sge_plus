# Ofelia cron job configuration
# https://github.com/mcuadros/ofelia
#
# Ofelia uses `job-exec` to run commands inside the already-running `sge_plus`
# container. The `container` value must match the --name passed to `docker run`.
#
# Restart the ofelia container to apply changes:
#   docker restart ofelia

[globals]
  save-folder = /tmp

[job-exec "decidim-meetings-clean-registration-forms"]
  schedule  = 0 3 * * *
  container = sge_plus
  command   = bundle exec rake decidim_meetings:clean_registration_forms
  user      = www-data

[job-exec "tmp-clear"]
  schedule  = 30 3 * * 1
  container = sge_plus
  command   = bundle exec rake tmp:clear
  user      = www-data

[job-exec "decidim-reminders"]
  schedule  = 0 4 * * *
  container = sge_plus
  command   = bundle exec rake decidim:reminders:all
  user      = www-data

[job-exec "decidim-delete-download-data"]
  schedule  = 30 4 * * 0
  container = sge_plus
  command   = bundle exec rake decidim:delete_download_your_data_files
  user      = www-data

[job-exec "decidim-metrics"]
  schedule  = 0 5 * * *
  container = sge_plus
  command   = bundle exec rake decidim:metrics:all
  user      = www-data

[job-exec "decidim-open-data"]
  schedule  = 0 6 * * *
  container = sge_plus
  command   = bundle exec rake decidim:open_data:export
  user      = www-data

[job-exec "decidim-notifications-daily"]
  schedule  = 30 6 * * *
  container = sge_plus
  command   = bundle exec rake decidim:mailers:notifications_digest_daily
  user      = www-data

[job-exec "decidim-notifications-weekly"]
  schedule  = 0 7 * * 0
  container = sge_plus
  command   = bundle exec rake decidim:mailers:notifications_digest_weekly
  user      = www-data
